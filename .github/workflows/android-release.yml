name: Build Signed Android Release (APK + AAB)

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "Version name (e.g. 1.0.0)"
        required: false
        default: "1.0.0"
      version_code:
        description: "Version code (integer, increment each release)"
        required: false
        default: "1"
  push:
    tags:
      - "v*"

jobs:
  build-release:
    name: Build & Sign Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: 34.0.0

      - name: Install dependencies
        run: npm ci

      - name: Build web assets
        run: npm run build

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Apply version + signing config to app/build.gradle
        env:
          VERSION_NAME: ${{ github.event.inputs.version_name || github.ref_name }}
          VERSION_CODE: ${{ github.event.inputs.version_code || github.run_number }}
        run: |
          GRADLE_FILE="android/app/build.gradle"
          sed -i "s/versionCode .*/versionCode ${VERSION_CODE}/" "$GRADLE_FILE"
          sed -i "s/versionName .*/versionName \"${VERSION_NAME}\"/" "$GRADLE_FILE"

          if ! grep -q "signingConfigs {" "$GRADLE_FILE"; then
            python3 - <<'PY'
          import re, pathlib
          p = pathlib.Path("android/app/build.gradle")
          s = p.read_text()
          signing_block = '''
     signingConfigs {
         release {
             storeFile file(System.getenv("KEYSTORE_PATH") ?: "release.keystore")
             storePassword System.getenv("KEYSTORE_PASSWORD")
             keyAlias System.getenv("KEY_ALIAS")
             keyPassword System.getenv("KEY_PASSWORD")
         }
     }
 '''
          s = re.sub(r"(android\s*\{)", r"\1" + signing_block, s, count=1)
          s = re.sub(
              r"buildTypes\s*\{\s*release\s*\{",
              "buildTypes {\n        release {\n            signingConfig signingConfigs.release",
              s,
              count=1,
          )
          p.write_text(s)
          PY
          fi

          echo "----- build.gradle preview -----"
          sed -n '1,80p' "$GRADLE_FILE"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Missing KEYSTORE_BASE64 secret. Add it in Settings → Secrets → Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon -x lint

      - name: Build release AAB (Play Store bundle)
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/android/app/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease --no-daemon -x lint

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: warn

      - name: Upload signed AAB
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: warn

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            android/app/build/outputs/bundle/release/app-release.aab
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}